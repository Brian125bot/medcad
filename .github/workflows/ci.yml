# CI for the CadenceRx mobile app (mobile/). Mirrors the local gate in
# mobile/docs/development.md. No secrets are used.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: mobile (typecheck, lint, tests, export)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (storage / tests project)
        run: npm run typecheck:storage

      - name: Lint
        run: npm run lint

      - name: Tests (storage suites + vitest with 100% coverage gate)
        run: npm test

      - name: Timezone matrix
        run: npm run test:tz

      - name: Expo export (iOS, Android, web)
        run: npx expo export --platform all --output-dir dist
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
